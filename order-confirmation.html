<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - BHEE Fashion Home</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

    <!-- HEADER -->

    <section id="header">

        <a href="index.html">

            <img
                src="images/logo.png"
                class="logo"
                alt="BHEE Fashion Home"
            >

        </a>

    </section>


    <!-- ORDER CONFIRMATION -->

    <section class="confirmation-page">

        <div class="confirmation-card">

            <div class="confirmation-icon">

                <i class="fas fa-check"></i>

            </div>


            <h1>Order Confirmed!</h1>


            <p class="confirmation-message">

                Thank you for shopping with
                <strong>BHEE Fashion Home</strong>.

            </p>


            <p>
                Your order has been received successfully.
            </p>


            <div class="order-number">

                <span>Order Number</span>

                <strong id="order-number">
                    BHF-000000
                </strong>

            </div>


            <div class="confirmation-actions">

                <a href="shop.html" class="secondary-btn ">
                    Continue Shopping
                </a>

                <a href="index.html" class="secondary-btn">
                    Back to Home
                </a>

            </div>

        </div>

    </section>


    <script src="order-confirmation.js"></script>

</body>

</html>
